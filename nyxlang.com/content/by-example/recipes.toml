# content/by-example/recipes.toml — catálogo del recetario «Nyx por ejemplo».
#
# Fuente de verdad del ALCANCE: qué recetas se publican, en qué orden y bajo qué
# categoría. Lo consumen `scripts/sync-recipes.sh` (copia de los .nx, stubs,
# --check, --drift) y el generador (`gen.nx`, sección by-example).
#
# Claves PLANAS a propósito: std/toml (`toml_parse`) devuelve un Map<String> y
# prefija cada clave con el nombre de la sección, así `[r24]` + `slug = "…"` se
# lee como `r24.slug`. Todos los valores son strings (incluidos los 0/1), porque
# eso es lo que devuelve el parser y lo que consume el motor de templates.
#
# El nombre de cada tabla es `r` + el número con cero a la izquierda:
# `[r01]`…`[r70]`, `[r71]`…`[r100]`, `[r101]`, `[r102]`.
#
# Claves de cada tabla `[rNN]`:
#   slug      nombre del archivo sin extensión, IDÉNTICO al .nx del monorepo
#             (`examples/by-example/<slug>.nx`) y a la URL (`<slug>.html`).
#   num       número de la receta, con cero a la izquierda, tal como se muestra.
#   category  id de categoría (ver `categories`); estable, el nombre visible sale
#             de los diccionarios i18n.
#   excluded  "1" = NO se publica. Las recetas de los stacks extraídos (71-100) y
#             54-resp-protocol quedan fuera del sitio: su código depende de
#             productos que ya no viven en este repo. Sus URLs viejas
#             (/by-example/71-kv-basic.html y compañía) DEJAN DE EXISTIR en la
#             fase 2 — decisión del plan del rediseño, no un descuido.
#   reason    presente SOLO cuando `excluded = "1"` por un motivo distinto del
#             split de los stacks. Hoy: "broken-with-0.31.0" en 31 y 63, dos
#             recetas que el propio compilador no puede correr (31 hace SIGSEGV
#             porque `enumerate()` no devuelve pares; 63 se cuelga porque
#             `select` consume el valor del canal y el `case` lo vuelve a pedir).
#             Las dos tienen ficha [ALTA] en el TASKS.md del monorepo y vuelven
#             al `order` cuando esas fichas se cierren; su sidecar se conserva.
#   sidecar   "1" = su prosa (título, blurb, intro, salida, explicación) se
#             extrajo del recetario viejo a content/by-example/<slug>.{en,es}.html.
#             "0" = no hay prosa heredada: o está excluida, o es una receta nueva
#             cuyo sidecar nace como STUB con TODO (101 y 102).
#
# La numeración NO es contigua ni ordinal: 54 falta, y 101/102 van al final. El
# orden de publicación es el de `order`, no el de las claves de un Map.

# Categorías, en orden de aparición en el índice.
categories = "fundamentals,io-data,types-patterns,advanced,networking,concurrency,systems"

# Recetas publicadas, en orden de índice y de la navegación prev/next.
order = "01-hello-world,02-variables,03-functions,04-control-flow,05-arrays,06-maps,07-strings,08-structs,09-enums,10-closures,11-file-read-write,12-stdin-input,13-cli-args,14-env-vars,15-json-parse,16-json-serialize,17-regex,18-csv,19-datetime,20-spawn-channel,21-traits,22-trait-bounds,23-derive-clone,24-option-some-none,25-result-ok-err,26-try-operator,27-if-let,28-match-guard,29-iterator-map-filter,30-iterator-fold,32-iterator-take-skip,33-recursion,34-sorting,35-error-handling,36-defer-cleanup,37-sleep-timer,38-crypto-hash,39-random-uuid,40-thread-spawn,41-base64,42-url-encode,43-toml-config,44-msgpack,45-dns-resolve,46-tcp-client,47-tcp-server,48-udp-socket,49-http-get,50-http-post,51-http-server,52-http-middleware,53-websocket,55-sqlite,56-csv-write,57-mutex,58-channel-patterns,59-worker-pool,60-producer-consumer,61-waitgroup,62-semaphore,64-fork-exec,65-pipes,66-signal-handling,67-file-watcher,68-process-control,69-raw-terminal,70-shebang-script,101-file-errors-two-tier,102-template-flask-style"

