why_label = "Why Nyx"
why_title = "What it gives the person writing it."
why_v_native = "nyx build compiles through LLVM to a native executable. There is no virtual machine and no interpreter at run time."
why_v_self = "The compiler is written in Nyx and compiles itself to identical LLVM IR: the fixed point is checked, not promised."
why_v_stdlib = "HTTP, PostgreSQL, SQLite, JSON, CSV, PDF and XLSX come with the language. Its columnar CSV reader grouped and filtered 5 million rows in 0.93 s, against 1.21 s for pandas, as measured in the release notes for 0.38.0."
why_v_stdlib_link = "See the recipe"
why_v_typing = "Annotate a binding and the compiler checks it; leave the type out and it is inferred or left open. A script can start loose and get stricter as it grows."
